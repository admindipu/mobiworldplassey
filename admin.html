<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker Admin Panel - Mobi World</title>
    <style>
        :root {
            --primary: #00ff66;
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --text-main: #00ff66;
            --text-muted: #9ca3af;
        }
        body { font-family: 'Courier New', Courier, monospace; background: var(--bg-color); margin: 0; padding: 0; color: var(--text-main); }
        header { background: #000; color: var(--primary); padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 2px solid var(--primary); box-shadow: 0 0 15px rgba(0,255,102,0.3); text-shadow: 0 0 8px rgba(0,255,102,0.6); }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: var(--card-bg); border: 1px solid #1f2937; border-radius: 12px; padding: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #34d399; text-transform: uppercase; letter-spacing: 1px; }
        input, select, textarea { width: 100%; padding: 10px; background: #030712; border: 1px solid #374151; border-radius: 6px; font-size: 14px; color: #fff; box-sizing: border-box; outline: none; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(0,255,102,0.4); }
        textarea { resize: vertical; height: 80px; }
        .btn { background: var(--primary); color: #000; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: center; text-transform: uppercase; box-shadow: 0 0 10px rgba(0,255,102,0.4); transition: 0.2s; }
        .btn:hover { background: #00cc52; box-shadow: 0 0 15px rgba(0,255,102,0.8); }
        .btn-banner { background: #3b82f6; color: #fff; box-shadow: 0 0 10px rgba(59,130,246,0.4); margin-top: 10px; }
        .btn-cancel { background: #ef4444; color: #fff; margin-top: 5px; }
        .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #1f2937; font-size: 13px; color: #fff; }
        .action-btns { display: flex; gap: 5px; }
        .edit-btn { background: #3b82f6; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; float: right; font-weight: bold; }
        
        #login-section { display: block; }
        #admin-dashboard { display: none; }
        .matrix-glow { text-shadow: 0 0 5px #00ff66; }
    </style>
</head>
<body>

    <header>
        💻 SYSTEM_ADMIN // MOBI_WORLD 
        <button class="logout-btn" onclick="logout()" id="logout-ui" style="display:none;">LOCK</button>
    </header>

    <div class="container">
        <!-- Login Screen -->
        <div id="login-section" class="card">
            <h3 class="matrix-glow">🔒 SECURE LOGIN</h3>
            <div class="form-group">
                <label>Access Password</label>
                <input type="password" id="admin-pass" placeholder="Enter secure key...">
            </div>
            <button class="btn" onclick="checkLogin()">Authenticate</button>
        </div>

        <!-- Dashboard -->
        <div id="admin-dashboard">
            <!-- Banner Manager Card -->
            <div class="card">
                <h3 class="matrix-glow">🖼️ Manage Sliding Banners (3s Slider)</h3>
                <div class="form-group">
                    <label>Banner Links (1 Link Per Line / ImgBB URL)</label>
                    <textarea id="banner-links" placeholder="https://i.ibb.co/...\nhttps://i.ibb.co/..."></textarea>
                </div>
                <button class="btn btn-banner" onclick="saveBanners()">💾 Update Sliding Banners</button>
            </div>

            <!-- Phone Manager Card -->
            <div class="card">
                <h3 id="form-title" class="matrix-glow">➕ Add New Phone</h3>
                <input type="hidden" id="edit-index" value="">
                <div class="form-group">
                    <label>Model Name</label>
                    <input type="text" id="model" placeholder="e.g. Vivo V21e">
                </div>
                <div class="form-group">
                    <label>RAM / ROM</label>
                    <input type="text" id="ramrom" placeholder="e.g. 8/128 GB">
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="text" id="color" placeholder="e.g. Sky Blue">
                </div>
                <div class="form-group">
                    <label>Condition</label>
                    <input type="text" id="condition" placeholder="e.g. Fresh / In Warranty">
                </div>
                <div class="form-group" style="display: flex; gap: 10px;">
                    <div style="flex: 1;">
                        <label>Offer Price (৳)</label>
                        <input type="number" id="price" placeholder="35000">
                    </div>
                    <div style="flex: 1;">
                        <label>Regular Price (৳)</label>
                        <input type="number" id="oldprice" placeholder="40000">
                    </div>
                </div>
                <div class="form-group">
                    <label>Specifications / Description</label>
                    <textarea id="description" placeholder="Display, Processor, Camera details..."></textarea>
                </div>
                <div class="form-group">
                    <label>ImgBB Viewer Link</label>
                    <input type="text" id="image" placeholder="https://ibb.co/...">
                </div>
                <button class="btn" id="submit-btn" onclick="savePhone()">🚀 Add Phone to Live Stock</button>
                <button class="btn btn-cancel" id="cancel-btn" style="display:none;" onclick="resetForm()">❌ Cancel Edit</button>
            </div>

            <!-- Stock List Card -->
            <div class="card">
                <h3 class="matrix-glow">📦 Live Database Stock</h3>
                <div id="stock-list">Scanning database...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwiDSo8tOQ7MwHO344Ij1DSb9cKUmf121PXUyrey7VeMH2_dcM6Tswwak6YUo37oDiB/exec";
        let allPhones = [];

        window.onload = function() {
            let sessionActive = sessionStorage.getItem("mobi_admin_logged");
            if(sessionActive === "true") {
                document.getElementById("login-section").style.display = "none";
                document.getElementById("admin-dashboard").style.display = "block";
                document.getElementById("logout-ui").style.display = "inline-block";
                loadDashboardData();
            } else {
                document.getElementById("login-section").style.display = "block";
                document.getElementById("admin-dashboard").style.display = "none";
                document.getElementById("logout-ui").style.display = "none";
            }
        };

        function checkLogin() {
            let pass = document.getElementById("admin-pass").value;
            if(pass === "mobiW0RLD@2026") {
                sessionStorage.setItem("mobi_admin_logged", "true");
                document.getElementById("login-section").style.display = "none";
                document.getElementById("admin-dashboard").style.display = "block";
                document.getElementById("logout-ui").style.display = "inline-block";
                loadDashboardData();
            } else {
                alert("ACCESS DENIED: Incorrect Password!");
            }
        }

        function logout() {
            sessionStorage.removeItem("mobi_admin_logged");
            location.reload();
        }

        async function loadDashboardData() {
            try {
                let res = await fetch(API_URL);
                let data = await res.json();
                
                allPhones = data.phones || data;
                let banners = data.banners || [];
                document.getElementById("banner-links").value = banners.join("\n");

                let html = "";
                allPhones.forEach((p, index) => {
                    let model = p.model || 'Phone';
                    let price = p.price || '';
                    html += `
                        <div class="stock-item">
                            <span><b>${model}</b><br><span style="color:#9ca3af;">৳${price}</span></span>
                            <div class="action-btns">
                                <button class="edit-btn" onclick="editPhone(${index})">Edit</button>
                                <button class="delete-btn" onclick="deletePhone(${index})">Del</button>
                            </div>
                        </div>
                    `;
                });
                document.getElementById("stock-list").innerHTML = html || "No records found.";
            }catch(e){
                document.getElementById("stock-list").innerHTML = "Error loading database.";
            }
        }

        async function saveBanners() {
            let rawText = document.getElementById("banner-links").value;
            let bannerArray = rawText.split("\n").map(b => b.trim()).filter(Boolean);

            alert("Updating banners...");
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "updateBanners", banners: bannerArray })
            });
            alert("Banners updated successfully!");
        }

        async function savePhone() {
            let editIndex = document.getElementById("edit-index").value;
            let model = document.getElementById("model").value;
            let ramrom = document.getElementById("ramrom").value;
            let color = document.getElementById("color").value;
            let condition = document.getElementById("condition").value;
            let price = document.getElementById("price").value;
            let oldprice = document.getElementById("oldprice").value;
            let description = document.getElementById("description").value;
            let image = document.getElementById("image").value;

            if(!model || !price) {
                alert("Error: Model and Offer Price are required!");
                return;
            }

            let action = editIndex === "" ? "add" : "update";
            let btn = document.getElementById("submit-btn");
            btn.innerText = action === "add" ? "Adding..." : "Updating...";

            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action, index: editIndex, model, ramrom, color, condition, price, oldprice, description, image })
            });

            alert(action === "add" ? "Phone added successfully!" : "Phone updated successfully!");
            location.reload();
        }

        function editPhone(index) {
            let p = allPhones[index];
            document.getElementById("edit-index").value = index;
            document.getElementById("model").value = p.model || '';
            document.getElementById("ramrom").value = p.ramrom || '';
            document.getElementById("color").value = p.color || '';
            document.getElementById("condition").value = p.condition || '';
            document.getElementById("price").value = p.price || '';
            document.getElementById("oldprice").value = p.oldprice || '';
            document.getElementById("description").value = p.description || '';
            document.getElementById("image").value = p.image || '';

            document.getElementById("form-title").innerText = "✏️ Edit Phone Record";
            document.getElementById("submit-btn").innerText = "💾 Update Phone Data";
            document.getElementById("cancel-btn").style.display = "block";
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function resetForm() {
            document.getElementById("edit-index").value = "";
            document.getElementById("model").value = "";
            document.getElementById("ramrom").value = "";
            document.getElementById("color").value = "";
            document.getElementById("condition").value = "";
            document.getElementById("price").value = "";
            document.getElementById("oldprice").value = "";
            document.getElementById("description").value = "";
            document.getElementById("image").value = "";

            document.getElementById("form-title").innerText = "➕ Add New Phone";
            document.getElementById("submit-btn").innerText = "🚀 Add Phone to Live Stock";
            document.getElementById("cancel-btn").style.display = "none";
        }

        async function deletePhone(index) {
            if(!confirm("WARNING: Are you sure you want to delete this record?")) return;
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: "delete", index })
            });
            alert("Record deleted!");
            loadDashboardData();
        }
    </script>
</body>
</html>
